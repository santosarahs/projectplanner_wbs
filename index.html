<title>Project Master</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #f5f7f4;
    --surface: #ffffff;
    --surface-2: #eef1ec;
    --surface-3: #e4e8e1;
    --border: #dde3d9;
    --border-strong: #c7cec1;
    --text: #1c2620;
    --text-muted: #5c6a60;
    --text-faint: #8b968a;
    --accent: #0b6e4f;
    --accent-soft: #e2f2ea;
    --accent-strong: #085840;
    --ok: #2f8f52;
    --ok-soft: #e5f3e7;
    --warn: #b5750f;
    --warn-soft: #fbeed8;
    --crit: #b1402a;
    --crit-soft: #fbe6e1;
    --idle: #7d867d;
    --idle-soft: #eceee9;
    --shadow: 0 1px 2px rgba(28, 38, 32, 0.06), 0 8px 24px -12px rgba(28, 38, 32, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10150f;
      --surface: #171e17;
      --surface-2: #1d251d;
      --surface-3: #263025;
      --border: #2b342a;
      --border-strong: #3a453a;
      --text: #e7ece5;
      --text-muted: #a3ac9d;
      --text-faint: #77816f;
      --accent: #3fb789;
      --accent-soft: #16362a;
      --accent-strong: #6ed3a9;
      --ok: #4cae72;
      --ok-soft: #17301f;
      --warn: #d99a3d;
      --warn-soft: #3a2c12;
      --crit: #e2705a;
      --crit-soft: #3c1f18;
      --idle: #8a9384;
      --idle-soft: #232b22;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10150f;
    --surface: #171e17;
    --surface-2: #1d251d;
    --surface-3: #263025;
    --border: #2b342a;
    --border-strong: #3a453a;
    --text: #e7ece5;
    --text-muted: #a3ac9d;
    --text-faint: #77816f;
    --accent: #3fb789;
    --accent-soft: #16362a;
    --accent-strong: #6ed3a9;
    --ok: #4cae72;
    --ok-soft: #17301f;
    --warn: #d99a3d;
    --warn-soft: #3a2c12;
    --crit: #e2705a;
    --crit-soft: #3c1f18;
    --idle: #8a9384;
    --idle-soft: #232b22;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-inline: 20px;
    padding-block: 28px 60px;
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .page {
    max-width: 1180px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: #fff;
    flex: none;
  }

  .brand-text { display: flex; flex-direction: column; gap: 2px; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .controls {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex-wrap: wrap;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .field > span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  select, input[type="search"] {
    font: inherit;
    font-size: 13.5px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 8px 11px;
    min-height: 38px;
  }

  select#weekSelect { min-width: 210px; font-family: "IBM Plex Mono", monospace; }
  input#searchInput { min-width: 220px; }

  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ---------- Meta strip ---------- */
  .meta-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .meta-strip .dot { color: var(--text-faint); }
  .meta-strip b { color: var(--text); font-weight: 600; }

  /* ---------- KPI tiles ---------- */
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: var(--shadow);
  }

  .kpi .num {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }

  .kpi .lbl {
    font-size: 12px;
    color: var(--text-muted);
  }

  .kpi.ok .num { color: var(--ok); }
  .kpi.warn .num { color: var(--warn); }
  .kpi.crit .num { color: var(--crit); }

  /* ---------- Team filter chips ---------- */
  .team-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.01em;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip .count { opacity: 0.75; }

  /* ---------- Team panels ---------- */
  main { display: flex; flex-direction: column; gap: 18px; }

  .team-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .team-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  .team-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.005em;
  }

  .team-head-left { display: flex; align-items: center; gap: 10px; }

  .team-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
  }

  .issue-flag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--crit);
    background: var(--crit-soft);
    border-radius: 999px;
    padding: 3px 9px;
  }

  .team-rows { display: flex; flex-direction: column; }

  .project-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .project-row:last-child { border-bottom: none; }
  .project-row:nth-child(even) { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }

  .row-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .row-title-block { display: flex; gap: 10px; min-width: 0; }

  .row-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-faint);
    padding-top: 2px;
    flex: none;
  }

  .row-title-wrap { min-width: 0; }

  .row-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
  }

  .row-meta {
    margin-top: 2px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
  }

  .status-pill {
    flex: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .status-pill.ok { background: var(--ok-soft); color: var(--ok); }
  .status-pill.warn { background: var(--warn-soft); color: var(--warn); }
  .status-pill.idle { background: var(--idle-soft); color: var(--idle); }
  .status-pill.crit { background: var(--crit-soft); color: var(--crit); }

  .row-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 20px;
  }
  .row-body.single { grid-template-columns: 1fr; }

  .field-block {
    min-width: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 11px;
  }

  .field-block .f-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 4px;
  }

  .field-block .f-value {
    font-size: 13px;
    color: var(--text);
    white-space: pre-line;
    line-height: 1.45;
  }
  .field-block .f-value.empty { color: var(--text-faint); font-style: italic; }

  .callouts { display: flex; flex-direction: column; gap: 8px; padding: 0 18px 14px; }

  .callout {
    border-radius: 9px;
    padding: 10px 12px;
    border-left: 3px solid var(--crit);
    background: var(--crit-soft);
  }
  .callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }

  .callout .c-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--crit);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .callout.warn .c-label { color: var(--warn); }

  .callout ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
  .callout li { font-size: 12.5px; color: var(--text); line-height: 1.4; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
  }

  .page-footer {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
  }

  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .row-body { grid-template-columns: 1fr; }
    .row-head { flex-direction: column; }
    .controls { width: 100%; }
    .field { flex: 1 1 160px; }
    select#weekSelect, input#searchInput { width: 100%; }
  }
</style>

<div class="page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">PM</span>
      <div class="brand-text">
        <span class="eyebrow">Weekly Project Tracker</span>
        <h1>Project Master</h1>
      </div>
    </div>
    <div class="controls">
      <label class="field">
        <span>Week</span>
        <select id="weekSelect"></select>
      </label>
      <label class="field search-field">
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="Project or lead…" autocomplete="off" />
      </label>
    </div>
  </header>

  <div class="meta-strip">
    <span>Reporting period <b id="reportingRange">—</b></span>
    <span class="dot">·</span>
    <span>Report generated <b id="generatedOn">—</b></span>
  </div>

  <section class="kpis" id="kpis"></section>

  <nav class="team-filter" id="teamFilter"></nav>

  <main id="teamsContainer"></main>

  <footer class="page-footer">Source: projectmaster.xlsx &nbsp;·&nbsp; <span id="weekCount"></span> weekly reports on file</footer>
</div>

<script>
  let DATA = null;
  let activeTeam = 'all';

  const els = {
    weekSelect: document.getElementById('weekSelect'),
    searchInput: document.getElementById('searchInput'),
    reportingRange: document.getElementById('reportingRange'),
    generatedOn: document.getElementById('generatedOn'),
    kpis: document.getElementById('kpis'),
    teamFilter: document.getElementById('teamFilter'),
    teamsContainer: document.getElementById('teamsContainer'),
    weekCount: document.getElementById('weekCount'),
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function isBlank(v) {
    if (!v) return true;
    const t = String(v).trim().toLowerCase();
    return t === '' || t === 'none' || t === '-' || t === 'n/a' || t === 'no plotted tasks';
  }

  function findField(headerLabels, re) {
    for (let i = 1; i < headerLabels.length; i++) {
      if (re.test(headerLabels[i])) return i;
    }
    return -1;
  }

  function rowStatus(keyUpdates, nextSteps) {
    const ku = (keyUpdates || '').toLowerCase();
    const ns = (nextSteps || '').toLowerCase();
    if (ku.includes('complet')) return { label: 'Completed', cls: 'ok' };
    if (ku.includes('on-hold') || ku.includes('on hold') || ns.includes('on-hold') || ns.includes('on hold')) {
      return { label: 'On hold', cls: 'warn' };
    }
    if (!isBlank(keyUpdates)) return { label: 'Updated', cls: 'ok' };
    if (isBlank(keyUpdates) && isBlank(nextSteps)) return { label: 'No update', cls: 'idle' };
    return { label: 'Tracking', cls: 'idle' };
  }

  function buildFieldBlocks(headerLabels, values, skipIdx) {
    const blocks = [];
    for (let i = 1; i < headerLabels.length; i++) {
      if (skipIdx.has(i)) continue;
      const label = headerLabels[i];
      const val = values[i];
      blocks.push({ label, val });
    }
    return blocks;
  }

  function renderWeek(sheetName) {
    const sheet = DATA.sheets[sheetName];
    els.reportingRange.textContent = sheet.reportingDate || '—';
    els.generatedOn.textContent = sheet.generatedDate || '—';

    const teams = (sheet.teams || []).filter((t) => t.header && t.header.length && !/^\d+$/.test(String(t.name || '').trim()));

    // ---- KPIs ----
    let total = 0, updated = 0, onHold = 0, issues = 0;
    const perTeamStatus = [];

    teams.forEach((team) => {
      const h = team.header;
      const kuIdx = findField(h, /key updat/i);
      const nsIdx = findField(h, /next step/i);
      const statuses = [];
      (team.rows || []).forEach((r) => {
        total++;
        const ku = kuIdx >= 0 ? r[kuIdx] : null;
        const ns = nsIdx >= 0 ? r[nsIdx] : null;
        const st = (kuIdx >= 0 || nsIdx >= 0) ? rowStatus(ku, ns) : { label: '', cls: 'idle' };
        statuses.push(st);
        if (st.cls === 'ok') updated++;
        if (st.cls === 'warn') onHold++;
      });
      issues += (team.criticalIssues || []).length + (team.escalations || []).length;
      perTeamStatus.push(statuses);
    });

    els.kpis.innerHTML = `
      <div class="kpi"><div class="num mono">${total}</div><div class="lbl">Projects tracked</div></div>
      <div class="kpi ok"><div class="num mono">${updated}</div><div class="lbl">Updated this week</div></div>
      <div class="kpi warn"><div class="num mono">${onHold}</div><div class="lbl">On hold</div></div>
      <div class="kpi crit"><div class="num mono">${issues}</div><div class="lbl">Open issues flagged</div></div>
    `;

    // ---- team filter chips ----
    const teamCounts = teams.map((t) => ({ name: t.name, count: (t.rows || []).length }));
    if (!teams.some((t) => t.name === activeTeam)) activeTeam = 'all';
    els.teamFilter.innerHTML = [
      `<button class="chip ${activeTeam === 'all' ? 'active' : ''}" data-team="all">All teams <span class="count mono">${total}</span></button>`,
      ...teamCounts.map((t) => `<button class="chip ${activeTeam === t.name ? 'active' : ''}" data-team="${esc(t.name)}">${esc(t.name)} <span class="count mono">${t.count}</span></button>`),
    ].join('');
    els.teamFilter.querySelectorAll('.chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeTeam = btn.dataset.team;
        renderWeek(sheetName);
      });
    });

    // ---- team panels ----
    const query = els.searchInput.value.trim().toLowerCase();
    const visibleTeams = teams.filter((t) => activeTeam === 'all' || t.name === activeTeam);

    const panelsHtml = visibleTeams.map((team) => {
      const h = team.header;
      const projIdx = (() => {
        const i = findField(h, /project|app\b/i);
        return i >= 0 ? i : 1;
      })();
      const leadIdx = findField(h, /lead/i);
      const dateIdx = findField(h, /date/i);
      const kuIdx = findField(h, /key updat/i);
      const nsIdx = findField(h, /next step/i);
      const taskIdx = findField(h, /task/i);

      const skip = new Set([projIdx]);
      if (leadIdx >= 0) skip.add(leadIdx);
      if (dateIdx >= 0) skip.add(dateIdx);

      let rows = team.rows || [];
      if (query) {
        rows = rows.filter((r) => {
          const proj = (r[projIdx] || '').toString().toLowerCase();
          const lead = leadIdx >= 0 ? (r[leadIdx] || '').toString().toLowerCase() : '';
          return proj.includes(query) || lead.includes(query);
        });
      }

      if (query && rows.length === 0) return '';

      const rowsHtml = rows.map((r) => {
        const projectName = r[projIdx] || '(untitled)';
        const num = r[0];
        const lead = leadIdx >= 0 ? r[leadIdx] : null;
        const date = dateIdx >= 0 ? r[dateIdx] : null;
        const ku = kuIdx >= 0 ? r[kuIdx] : null;
        const ns = nsIdx >= 0 ? r[nsIdx] : null;
        const hasStatus = kuIdx >= 0 || nsIdx >= 0;
        const st = hasStatus ? rowStatus(ku, ns) : null;

        const metaBits = [];
        if (lead) metaBits.push(`Lead ${esc(lead)}`);
        if (date) metaBits.push(`Since ${esc(date)}`);

        const blocks = buildFieldBlocks(h, r, skip);
        const bodyCols = blocks.length > 1 ? '' : ' single';

        const blocksHtml = blocks.map((b) => `
          <div class="field-block">
            <div class="f-label">${esc(b.label)}</div>
            <div class="f-value ${isBlank(b.val) ? 'empty' : ''}">${isBlank(b.val) ? '—' : esc(b.val)}</div>
          </div>
        `).join('');

        return `
          <div class="project-row">
            <div class="row-head">
              <div class="row-title-block">
                <span class="row-num mono">${typeof num === 'number' ? num : ''}</span>
                <div class="row-title-wrap">
                  <div class="row-title">${esc(projectName)}</div>
                  ${metaBits.length ? `<div class="row-meta">${metaBits.map(esc).join(' &nbsp;·&nbsp; ')}</div>` : ''}
                </div>
              </div>
              ${st ? `<span class="status-pill ${st.cls}">${esc(st.label)}</span>` : ''}
            </div>
            ${blocks.length ? `<div class="row-body${bodyCols}">${blocksHtml}</div>` : ''}
          </div>
        `;
      }).join('');

      const callouts = [];
      if ((team.criticalIssues || []).length) {
        callouts.push(`
          <div class="callout">
            <div class="c-label">Critical issues or delays</div>
            <ul>${team.criticalIssues.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
          </div>
        `);
      }
      if ((team.escalations || []).length) {
        callouts.push(`
          <div class="callout warn">
            <div class="c-label">Escalations or support needed</div>
            <ul>${team.escalations.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
          </div>
        `);
      }

      const flagCount = (team.criticalIssues || []).length + (team.escalations || []).length;

      return `
        <section class="team-panel">
          <div class="team-head">
            <div class="team-head-left">
              <h2>${esc(team.name)}</h2>
              <span class="team-count mono">${rows.length}</span>
            </div>
            ${flagCount ? `<span class="issue-flag">${flagCount} flagged</span>` : ''}
          </div>
          <div class="team-rows">
            ${rowsHtml || '<div class="empty-state">No matching projects.</div>'}
          </div>
          ${callouts.length ? `<div class="callouts">${callouts.join('')}</div>` : ''}
        </section>
      `;
    }).filter(Boolean).join('');

    els.teamsContainer.innerHTML = panelsHtml || '<div class="empty-state">No projects match your search.</div>';
  }

  function boot(data) {
    DATA = data;
    els.weekCount.textContent = data.sheetOrder.length;

    els.weekSelect.innerHTML = data.sheetOrder.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    const defaultWeek = data.sheetOrder[data.sheetOrder.length - 1];
    els.weekSelect.value = defaultWeek;

    els.weekSelect.addEventListener('change', () => renderWeek(els.weekSelect.value));
    els.searchInput.addEventListener('input', () => renderWeek(els.weekSelect.value));

    renderWeek(defaultWeek);
  }

  fetch('data.json').then((r) => r.json()).then(boot).catch((err) => {
    els.teamsContainer.innerHTML = `<div class="empty-state">Could not load data.json — ${esc(err.message)}</div>`;
  });
</script>
